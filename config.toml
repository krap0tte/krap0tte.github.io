# Sert au développement local. Le déploiement l'IGNORE : il passe à `zola build`
# l'URL que GitHub Pages annonce (`actions/configure-pages`), pour que le site
# soit juste quel que soit l'endroit où il est publié.
base_url = "https://krap0tte.github.io"
title = "krapotte"
description = "Galerie de photographie"

# Compile sass/ vers public/ (compilateur intégré au binaire Zola, pas de Node).
# Désactivé par défaut : sans lui, sass/ est ignoré en silence et le site sort
# sans feuille de style.
compile_sass = true
